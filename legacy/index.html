<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Router</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <h1>Logic Router</h1>
            <p>Route the signals. Build the logic.</p>
        </header>
        
        <div class="game-container">
            <div id="toolbar" class="toolbar">
                <div class="tool-btn active" data-type="WIRE">Wire</div>
                <div class="tool-btn" data-type="AND">AND</div>
                <div class="tool-btn" data-type="OR">OR</div>
                <div class="tool-btn" data-type="NOT">NOT</div>
                <div class="tool-btn" data-type="ERASER">Eraser</div>
            </div>
            
            <div id="grid-container">
                <!-- Grid generated by JS -->
            </div>
            
            <div class="controls">
                <button id="simulate-btn">Simulate Circuit</button>
                <button id="reset-btn">Reset Level</button>
            </div>
            <div id="status" class="status-panel">System Ready</div>
        </div>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
